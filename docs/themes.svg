<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0e"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)" rx="18"/>

  <text x="50" y="54" font-size="24" font-weight="700" fill="#e8eaed">🎨 七套主题 · 一键切换 · localStorage 记忆</text>
  <text x="50" y="80" font-size="13.5" fill="#7f8b96">晨报 / 午夜 / 极光 / 墨绿 / Mac 风格 / 极简(Suckless) / 跟随系统 —— 头部主题下拉菜单即选即生效</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- 1 paper 晨报 -->
    <g>
      <rect x="40" y="110" width="280" height="200" rx="14" fill="#e8edf2"/>
      <rect x="40" y="110" width="280" height="14" rx="7" fill="#b06f08"/>
      <text x="62" y="170" fill="#10233b" font-size="17" font-weight="700">📰 晨报 Paper</text>
      <rect x="62" y="188" width="120" height="7" rx="3.5" fill="#c8d2dc"/>
      <rect x="62" y="204" width="180" height="7" rx="3.5" fill="#c8d2dc"/>
      <rect x="62" y="220" width="150" height="7" rx="3.5" fill="#c8d2dc"/>
      <rect x="62" y="246" width="90" height="24" rx="12" fill="#b06f08"/>
      <text x="74" y="263" fill="#ffffff" font-size="11">浅色 · 暖金主色</text>
      <rect x="62" y="278" width="90" height="8" rx="4" fill="#d7dde4"/>
      <rect x="62" y="292" width="200" height="8" rx="4" fill="#d7dde4"/>
    </g>

    <!-- 2 midnight 午夜 -->
    <g>
      <rect x="340" y="110" width="280" height="200" rx="14" fill="#0b0c0e" stroke="#262b32"/>
      <rect x="340" y="110" width="280" height="14" rx="7" fill="#ffc24b"/>
      <text x="362" y="170" fill="#e8eaed" font-size="17" font-weight="700">🌙 午夜 Midnight</text>
      <rect x="362" y="188" width="120" height="7" rx="3.5" fill="#2a2e33"/>
      <rect x="362" y="204" width="180" height="7" rx="3.5" fill="#2a2e33"/>
      <rect x="362" y="220" width="150" height="7" rx="3.5" fill="#2a2e33"/>
      <rect x="362" y="246" width="90" height="24" rx="12" fill="#4fd8ff"/>
      <text x="374" y="263" fill="#0b0c0e" font-size="11">深色 · 电光蓝</text>
      <rect x="362" y="278" width="90" height="8" rx="4" fill="#1c2024"/>
      <rect x="362" y="292" width="200" height="8" rx="4" fill="#1c2024"/>
    </g>

    <!-- 3 aurora 极光 -->
    <g>
      <rect x="640" y="110" width="280" height="200" rx="14" fill="#0e0d1a" stroke="#2b2740"/>
      <rect x="640" y="110" width="280" height="14" rx="7" fill="#c792ea"/>
      <text x="662" y="170" fill="#efecfd" font-size="17" font-weight="700">✨ 极光 Aurora</text>
      <rect x="662" y="188" width="120" height="7" rx="3.5" fill="#2b2740"/>
      <rect x="662" y="204" width="180" height="7" rx="3.5" fill="#2b2740"/>
      <rect x="662" y="220" width="150" height="7" rx="3.5" fill="#2b2740"/>
      <rect x="662" y="246" width="90" height="24" rx="12" fill="#c792ea"/>
      <text x="674" y="263" fill="#160f1f" font-size="11">深紫 · 霓虹渐变</text>
      <rect x="662" y="278" width="90" height="8" rx="4" fill="#241f3a"/>
      <rect x="662" y="292" width="200" height="8" rx="4" fill="#241f3a"/>
    </g>

    <!-- 4 ink 墨绿 -->
    <g>
      <rect x="940" y="110" width="280" height="200" rx="14" fill="#0b1411" stroke="#1f332a"/>
      <rect x="940" y="110" width="280" height="14" rx="7" fill="#7fd6a8"/>
      <text x="962" y="170" fill="#e4efe9" font-size="17" font-weight="700">🍃 墨绿 Ink</text>
      <rect x="962" y="188" width="120" height="7" rx="3.5" fill="#1f332a"/>
      <rect x="962" y="204" width="180" height="7" rx="3.5" fill="#1f332a"/>
      <rect x="962" y="220" width="150" height="7" rx="3.5" fill="#1f332a"/>
      <rect x="962" y="246" width="90" height="24" rx="12" fill="#7fd6a8"/>
      <text x="974" y="263" fill="#0d1a13" font-size="11">深绿 · 琥珀点缀</text>
      <rect x="962" y="278" width="90" height="8" rx="4" fill="#1b2a23"/>
      <rect x="962" y="292" width="200" height="8" rx="4" fill="#1b2a23"/>
    </g>

    <!-- 5 mac -->
    <g>
      <rect x="40" y="340" width="280" height="200" rx="14" fill="#f5f5f7"/>
      <rect x="40" y="340" width="280" height="14" rx="7" fill="#0071e3"/>
      <text x="62" y="400" fill="#1d1d1f" font-size="17" font-weight="700">🍎 Mac 风格</text>
      <rect x="62" y="418" width="120" height="7" rx="3.5" fill="#d2d2d7"/>
      <rect x="62" y="434" width="180" height="7" rx="3.5" fill="#d2d2d7"/>
      <rect x="62" y="450" width="150" height="7" rx="3.5" fill="#d2d2d7"/>
      <rect x="62" y="476" width="90" height="24" rx="12" fill="#0071e3"/>
      <text x="74" y="493" fill="#ffffff" font-size="11">浅色/深色 · 蓝</text>
      <rect x="62" y="508" width="90" height="8" rx="4" fill="#dedee3"/>
      <rect x="62" y="522" width="200" height="8" rx="4" fill="#dedee3"/>
    </g>

    <!-- 6 suckless 极简 -->
    <g>
      <rect x="340" y="340" width="280" height="200" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <rect x="340" y="340" width="280" height="10" fill="#000000"/>
      <text x="362" y="400" fill="#000000" font-size="17" font-weight="700">⬜ 极简 Suckless</text>
      <rect x="362" y="418" width="120" height="7" fill="#d0d0d0"/>
      <rect x="362" y="434" width="180" height="7" fill="#d0d0d0"/>
      <rect x="362" y="450" width="150" height="7" fill="#d0d0d0"/>
      <rect x="362" y="476" width="90" height="24" rx="0" fill="#000000"/>
      <text x="374" y="493" fill="#ffffff" font-size="11">纯白 · 无圆角 · 无阴影</text>
      <rect x="362" y="508" width="90" height="8" fill="#e0e0e0"/>
      <rect x="362" y="522" width="200" height="8" fill="#e0e0e0"/>
    </g>

    <!-- 7 auto -->
    <g>
      <rect x="640" y="340" width="280" height="200" rx="14" fill="#121418" stroke="#262b32"/>
      <rect x="640" y="340" width="280" height="10" fill="#8a8f98"/>
      <text x="662" y="400" fill="#e8eaed" font-size="17" font-weight="700">🔄 跟随系统 Auto</text>
      <rect x="662" y="418" width="120" height="7" rx="3.5" fill="#2a2e33"/>
      <rect x="662" y="434" width="180" height="7" rx="3.5" fill="#2a2e33"/>
      <rect x="662" y="450" width="150" height="7" rx="3.5" fill="#2a2e33"/>
      <rect x="662" y="476" width="90" height="24" rx="12" fill="#8a8f98"/>
      <text x="674" y="493" fill="#121418" font-size="11">prefers-color-scheme</text>
      <rect x="662" y="508" width="90" height="8" rx="4" fill="#1c2024"/>
      <rect x="662" y="522" width="200" height="8" rx="4" fill="#1c2024"/>
    </g>

    <!-- Note -->
    <g font-size="12.5" fill="#7f8b96">
      <rect x="40" y="580" width="1180" height="140" rx="14" fill="#10161c" stroke="#1f2a33"/>
      <text x="62" y="612" fill="#4fd8ff" font-size="16" font-weight="600">🧠 实现原理</text>
      <text x="62" y="638" fill="#c9d2da">localStorage 键 signal-theme 记忆用户选择；data-theme 属性挂在 &lt;html&gt; 上，CSS 变量驱动整套配色</text>
      <text x="62" y="662" fill="#c9d2da">极简主题（suckless）：白底黑字、方正无圆角、无阴影、无毛玻璃，致敬 suckless.org 的极简哲学</text>
      <text x="62" y="686" fill="#c9d2da">跟随系统：matchMedia 监听 prefers-color-scheme；主题切换同步 Giscus 评论暗/亮模式</text>
      <text x="62" y="706" fill="#7f8b96">signal:theme / signal:lang 自定义事件全局广播 · 首屏前内联脚本读存储，避免主题闪烁</text>
    </g>
  </g>
</svg>
