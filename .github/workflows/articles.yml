name: build-articles

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['feeds.json', 'articles.json']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Build full-text snapshot
        run: node build-articles.mjs
        working-directory: scripts

      - name: Commit and push articles.json
        run: |
          if ! git diff --quiet articles.json; then
            git config user.name "signal-bot"
            git config user.email "actions@users.noreply.github.com"
            git add articles.json
            git commit -m "chore: refresh full-text snapshot"
            git pull --rebase origin main
            git push
            echo "articles snapshot updated"
          else
            echo "no changes to articles.json"
          fi
