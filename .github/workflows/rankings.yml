name: build-rankings

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['rankings.json', 'feeds.json', 'articles.json']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build leaderboard snapshot
        run: node build-rankings.mjs
        working-directory: scripts

      - name: Commit and push rankings.json
        run: |
          if ! git diff --quiet rankings.json; then
            git config user.name "signal-bot"
            git config user.email "actions@users.noreply.github.com"
            git add rankings.json
            git commit -m "chore: refresh leaderboard snapshot"
            git pull --rebase origin main
            git push
            echo "rankings snapshot updated"
          else
            echo "no changes to rankings.json"
          fi
