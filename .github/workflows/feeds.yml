name: build-feeds

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [sync-feeds]
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['feeds.json', 'articles.json']

concurrency:
  group: feeds
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install feed builder dependencies
        run: npm ci
        working-directory: scripts

      - name: Build RSS + X snapshot
        run: node build-feeds.mjs
        working-directory: scripts

      - name: Commit and push feeds.json
        run: |
          if ! git diff --quiet feeds.json; then
            git config user.name "signal-bot"
            git config user.email "actions@users.noreply.github.com"
            git add feeds.json
            git commit -m "chore: refresh RSS + X snapshot"
            git pull --rebase origin main
            git push
            echo "snapshot updated"
          else
            echo "no changes to feeds.json"
          fi
