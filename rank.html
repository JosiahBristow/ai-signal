  .rank-tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 20px 0 4px; }

<script src="common.js"></script>
<script>
  (function () {
    "use strict";
    var RANK_URL = "rankings.json";
    var REFRESH_MS = 5 * 60 * 1000;
    var data = null;
    var active = null;
    var T = function (s) { return window.t ? window.t(s) : s; };
    function pick(o) { return window.SIGNAL_LANG === "en" ? (o && o.en) || "" : (o && o.zh) || ""; }

    function esc(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function load() {
      var el = document.getElementById("rank-loading");
      if (el) el.textContent = T("加载中…");
      fetch(RANK_URL + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (j) {
          data = j && Array.isArray(j.boards) ? j.boards : [];
          if (!data.length) throw new Error("empty boards");
          if (!active || !data.some(function (b) { return b.id === active; })) active = data[0].id;
          render();
          var up = document.getElementById("rank-updated");
          if (up) up.textContent = relTime(j.builtAt);
        })
        .catch(function () {
          var board = document.getElementById("rank-board");
          if (board) board.innerHTML = '<div class="rank-empty">' + T("快照不可用，稍后再试。") + "</div>";
          var err = document.getElementById("rank-err");
          if (err) err.hidden = false;
        });
    }

    function relTime(iso) {
      var ts = Date.parse(iso || "");
      if (Number.isNaN(ts)) return "";
      var d = Date.now() - ts;
      if (d < 0) return "now";
      var m = Math.floor(d / 60000);
      if (m < 1) return "now";
      if (m < 60) return m + "m";
      var h = Math.floor(m / 60);
      if (h < 24) return h + "h";
      return Math.floor(h / 24) + "d";
    }

    function boardName(b) {
      return pick(b.name) || b.id;
    }

    function renderTabs() {
      var el = document.getElementById("rank-tabs");
      if (!el || !data) return;
      el.innerHTML = "";
      data.forEach(function (b) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (b.id === active ? " active" : "");
        btn.setAttribute("role", "tab");
        btn.setAttribute("aria-selected", b.id === active ? "true" : "false");
        btn.textContent = boardName(b);
        btn.addEventListener("click", function () { active = b.id; renderTabs(); render(); });
        el.appendChild(btn);
      });
    }

    function render() {
      renderTabs();
      var board = document.getElementById("rank-board");
      if (!board || !data) return;
      var b = data.filter(function (x) { return x.id === active; })[0];
      if (!b || !Array.isArray(b.rows) || !b.rows.length) {
        board.innerHTML = '<div class="rank-empty">' + T("暂无数据") + "</div>";
        return;
      }
      var max = Math.max.apply(null, b.rows.map(function (r) { return r.value || 0; })) || 1;
      var rows = b.rows.map(function (r, i) {
        var pct = Math.max(2, Math.round((r.value / max) * 100));
        var noCls = i === 0 ? " top1" : i === 1 ? " top2" : i === 2 ? " top3" : "";
        var org = r.org ? '<span class="rank-org"> · ' + esc(r.org) + "</span>" : "";
        return '<tr><td class="rank-no' + noCls + '">' + (i + 1) + '</td>' +
          '<td class="rank-name">' + esc(r.name) + org + "</td>" +
          '<td><div class="rank-bar-wrap"><div class="rank-bar"><i style="width:' + pct + '%"></i></div>' +
          '<span class="rank-value">' + esc(r.display || r.value) + "</span></div></td></tr>";
      }).join("");
      var unit = pick(b.unit);
      var head = b.rows[0].display !== undefined || b.rows[0].display ? "" : "";
      board.innerHTML =
        '<table class="rank-table"><thead><tr>' +
          '<th class="rank-no">#</th>' +
          '<th>' + T("模型") + "</th>" +
          '<th style="text-align:right">' + esc(unit || T("数值")) + "</th>" +
        "</tr></thead><tbody>" + rows + "</tbody></table>" +
        '<div class="rank-meta">' +
          '<span>' + T("更新于") + " " + (b.updated || "") + " · " + T("数据源") + ' <a href="' + esc(b.url || "#") + '" target="_blank" rel="noopener">' + esc(b.id) + "</a></span>" +
          '<span id="rank-updated">' + T("同步于") + " " + (data.builtAt ? relTime(data.builtAt) + " " + T("前") : "") + "</span>" +
        "</div>";
      head; // noop
    }

    document.addEventListener("signal:lang", function () {
      renderTabs();
      render();
    });

    setInterval(function () { if (document.hidden !== true) load(); }, REFRESH_MS);
    load();
  })();
</script>
